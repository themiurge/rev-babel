<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>rev-babel capture test</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem 1.25rem;
         max-width: 32rem; margin-inline: auto; }
  h1 { font-size: 1.15rem; margin: 0 0 1rem; }
  button { font: inherit; font-weight: 600; padding: 1.1rem 1.5rem; width: 100%;
           border-radius: 12px; border: 0; background: #1a73e8; color: #fff; }
  button.stop { background: #b3261e; }
  button:disabled { opacity: .5; }
  .card { border: 1px solid #8883; border-radius: 10px; padding: .9rem 1.1rem;
          margin: 1rem 0; }
  .big { font-size: 1.4rem; font-weight: 600; }
  .ok { color: #0a7d32; } .bad { color: #b3261e; } .wait { color: #8a6d00; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .3rem .8rem; margin: 0; }
  dt { color: #8889; } dd { margin: 0; font-family: ui-monospace, monospace;
       overflow-wrap: anywhere; }
  #meter { height: 10px; background: #8883; border-radius: 5px; overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: #0a7d32; }
  #log { font-family: ui-monospace, monospace; font-size: .75rem; white-space: pre-wrap;
         max-height: 8rem; overflow-y: auto; color: #8889; }
</style>
<h1>rev-babel — phone capture test</h1>

<button id="btn">Start capturing</button>

<div class="card">
  <div class="big wait" id="state">idle</div>
  <div id="meter"><i></i></div>
</div>

<div class="card">
  <dl>
    <dt>codec</dt><dd id="mime">—</dd>
    <dt>sent</dt><dd id="sent">—</dd>
    <dt>rate</dt><dd id="rate">—</dd>
    <dt>wake lock</dt><dd id="wake">—</dd>
    <dt>socket</dt><dd id="sock">—</dd>
  </dl>
</div>

<div class="card"><div id="log">…</div></div>

<script>
const $ = id => document.getElementById(id);
let lines = [];
const say = m => { lines.push(new Date().toLocaleTimeString() + '  ' + m);
  $('log').textContent = lines.slice(-40).join('\n'); $('log').scrollTop = 1e6; };

const TOKEN = new URLSearchParams(location.search).get('t') || '';
let ws, rec, stream, wake, bytes = 0, chunks = 0, t0 = 0, timer;

// Pick the best container the browser will actually give us.
function pickMime() {
  const wanted = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus',
                  'audio/mp4;codecs=opus', 'audio/mp4'];
  for (const m of wanted) if (window.MediaRecorder?.isTypeSupported?.(m)) return m;
  return '';
}

async function start() {
  if (rec?.state === 'recording' || ws?.readyState === 1) { say('already capturing'); return; }
  $('btn').disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false,
               autoGainControl: true }
    });
  } catch (e) { $('state').textContent = 'mic denied'; $('state').className = 'big bad';
                say('getUserMedia failed: ' + e.name + ' — ' + e.message);
                $('btn').disabled = false; return; }

  const track = stream.getAudioTracks()[0];
  say('mic: ' + track.label);
  const st = track.getSettings();
  say('settings: ' + JSON.stringify({sampleRate: st.sampleRate, channelCount: st.channelCount}));

  // Level meter, so you can see the lavalier is live before trusting the numbers.
  const ac = new AudioContext();
  const an = ac.createAnalyser(); an.fftSize = 512;
  ac.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.frequencyBinCount);
  (function draw() {
    an.getByteTimeDomainData(buf);
    let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
    $('meter').firstElementChild.style.width = Math.min(100, peak / 128 * 300) + '%';
    requestAnimationFrame(draw);
  })();

  try { wake = await navigator.wakeLock.request('screen');
        $('wake').textContent = 'held';
        wake.addEventListener('release', () => { $('wake').textContent = 'released';
                                                 say('WAKE LOCK RELEASED'); });
  } catch (e) { $('wake').textContent = 'unavailable (' + e.name + ')'; }

  const mime = pickMime();
  $('mime').textContent = mime || '(browser default)';
  say('codec: ' + (mime || 'default'));

  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://')
            + location.host + '/audio?t=' + encodeURIComponent(TOKEN);
  ws = new WebSocket(url); ws.binaryType = 'arraybuffer';
  $('sock').textContent = 'connecting';

  ws.onopen = () => {
    $('sock').textContent = 'open';
    ws.send(JSON.stringify({hello: true, mime, sampleRate: st.sampleRate,
                            label: track.label, ua: navigator.userAgent}));
    rec = new MediaRecorder(stream, mime ? {mimeType: mime, audioBitsPerSecond: 32000}
                                         : {audioBitsPerSecond: 32000});
    rec.ondataavailable = e => {
      if (!e.data.size || ws.readyState !== 1) return;
      chunks++; bytes += e.data.size; ws.send(e.data);
    };
    rec.start(500);                       // 500 ms buffer, per plans/m4-network.md
    t0 = Date.now();
    $('state').textContent = 'capturing'; $('state').className = 'big ok';
    say('recording, 500 ms chunks');
    timer = setInterval(() => {
      const s = (Date.now() - t0) / 1000;
      $('sent').textContent = chunks + ' chunks · ' + (bytes / 1024).toFixed(1) + ' KiB';
      $('rate').textContent = (bytes * 8 / s / 1000).toFixed(1) + ' kbps · '
                            + s.toFixed(0) + ' s';
    }, 500);
    $('btn').disabled = false; $('btn').textContent = 'Stop'; $('btn').className = 'stop';
    $('btn').onclick = stop;              // rebind, or Stop starts a second capture
  };
  ws.onclose = e => { $('sock').textContent = 'closed (' + e.code + ')';
                      say('socket closed ' + e.code + ' ' + (e.reason || '')); stop(); };
  ws.onerror = () => { $('sock').textContent = 'error'; say('socket error'); };
}

function stop() {
  clearInterval(timer);
  try { rec?.state === 'recording' && rec.stop(); } catch {}
  stream?.getTracks().forEach(t => t.stop());
  wake?.release?.().catch(() => {});
  try { ws?.readyState === 1 && ws.close(1000, 'stopped'); } catch {}
  $('state').textContent = 'stopped'; $('state').className = 'big wait';
  $('btn').textContent = 'Start capturing'; $('btn').className = ''; $('btn').disabled = false;
  $('btn').onclick = start;
}

$('btn').onclick = start;
document.addEventListener('visibilitychange',
  () => say('page ' + (document.hidden ? 'HIDDEN (backgrounded)' : 'visible')));
</script>
