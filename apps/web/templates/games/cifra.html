<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password in codice</title>
<link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
{% import "_macros.html" as m with context %}
<style>
  body {
    margin: 0; padding: 20px; box-sizing: border-box;
    background: linear-gradient(135deg, #f1eafc 0%, #e6f4ea 100%);
    display: flex; flex-direction: column; align-items: center;
  }
  .screen { max-width: 620px; width: 100%; }
  h1 { margin: 0 0 4px; text-align: center; }
  .screen .slide-box { margin-bottom: 16px; }
  .screen .slide-box h2 { margin-top: 0; font-size: 1.1rem; }
  .panel {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.1); text-align: center;
  }
  .mode-buttons { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
  .word-display { font-size: 2.2rem; font-weight: 700; letter-spacing: 0.05em; margin: 10px 0 6px; color: #222; }
  .progress { color: #777; font-size: 0.9rem; margin-bottom: 14px; }
  input#answer {
    font-size: 1.4rem; padding: 0.5rem 0.8rem; width: 60%; text-align: center;
    border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box;
  }
  input#answer.correct { border-color: #1e7a3c; background: #eef7ef; }
  input#answer.wrong { border-color: #c0392b; background: #fdf1f0; }
  .btn {
    margin-top: 14px; padding: 10px 20px; font-size: 1rem; border: none;
    background: #5b3fc4; color: #fff; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { background: #4a32a3; }
  .btn.secondary { background: #8a6fd6; }
  .feedback { min-height: 1.4rem; margin-top: 10px; font-weight: 700; }
  .feedback.wrong { color: #c0392b; }
  .stats { display: flex; gap: 16px; justify-content: center; margin-top: 10px; color: #666; font-size: 0.95rem; }
  .complete { font-size: 1.4rem; margin-top: 10px; color: #084c2e; font-weight: 700; }
</style>
</head>
<body>
  <div class="screen">
    <h1>🔐 Password in codice!</h1>
    <div class="slide-box">
      <h2 {{ m.title_attr("Le vocali diventano numeri") }}>Le vocali diventano numeri</h2>
      <div class="vowel-map">
        <div class="vowel-pair"><span class="letter">a</span><span class="arrow">&rarr;</span><span class="digit">4</span></div>
        <div class="vowel-pair"><span class="letter">e</span><span class="arrow">&rarr;</span><span class="digit">3</span></div>
        <div class="vowel-pair"><span class="letter">i</span><span class="arrow">&rarr;</span><span class="digit">1</span></div>
        <div class="vowel-pair"><span class="letter">o</span><span class="arrow">&rarr;</span><span class="digit">0</span></div>
      </div>
      <p class="note" {{ m.title_attr("Alla fine aggiungi sempre un punto esclamativo:") }}>Alla fine aggiungi sempre un punto esclamativo: <strong>!</strong></p>
      <p class="note"><span {{ m.title_attr("Esempio:") }}>Esempio:</span> <strong>casa</strong> &rarr; <strong>c4s4!</strong></p>
    </div>

    <div class="panel" id="start-panel">
      <p {{ m.title_attr("Scrivi la versione cifrata di ogni parola, più veloce che puoi.") }}>Scrivi la versione cifrata di ogni parola, più veloce che puoi.</p>
      <div class="mode-buttons">
        <button id="startEasyBtn" class="btn" {{ m.title_attr("Inizia") }}>Inizia</button>
        <button id="startHardBtn" class="btn secondary" {{ m.title_attr("Inizia (difficile!)") }}>Inizia (difficile!)</button>
      </div>
    </div>

    <div class="panel" id="game-panel" style="display:none;">
      <div class="progress" id="progress"></div>
      <div class="word-display" id="word-display"></div>
      <input type="text" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <div><button id="checkBtn" class="btn" {{ m.title_attr("Verifica") }}>Verifica</button></div>
      <div class="feedback" id="feedback"></div>
      <div class="stats"><div><span {{ m.title_attr("Tempo:") }}>Tempo:</span> <span id="timer">0:00</span></div></div>
      <div class="complete" id="complete"></div>
      <button id="restartBtn" class="btn" style="display:none;" {{ m.title_attr("Ricomincia") }}>🔁 Ricomincia</button>
    </div>
  </div>

  <script>
    const STRINGS = {{ cifra_strings_json | safe }};

    // Two separate word pools, not just one list in random order: an easy
    // round and a hard round draw from different vocabulary entirely, and
    // each round samples a subset of its pool (not the whole thing every
    // time) so replaying doesn't always show the same words.
    const EASY_WORDS = ["casa", "mela", "sole", "pane", "vino", "gatto", "mano", "dito", "capo", "mare", "pizza", "porta"];
    const HARD_WORDS = ["email", "internet", "sicurezza", "documento", "connessione", "operazione", "indirizzo", "applicazione", "telefono", "messaggio", "account", "password", "schermo", "tastiera", "registrazione"];
    const ROUND_SIZE = 6;

    // Exact semantics of the spreadsheet formula this mirrors:
    // IF(A2<>"";SUBSTITUTE(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE(A2,"a","4"),"i","1"),"o","0"),"e","3")&"!";"")
    // Lowercase only, in this exact order - not a looser case-insensitive version.
    function encrypt(word) {
      if (!word) return "";
      return word.replace(/a/g, "4").replace(/i/g, "1").replace(/o/g, "0").replace(/e/g, "3") + "!";
    }

    function sample(pool, n) {
      const copy = pool.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, n);
    }

    const startPanel = document.getElementById("start-panel");
    const gamePanel = document.getElementById("game-panel");
    const startEasyBtn = document.getElementById("startEasyBtn");
    const startHardBtn = document.getElementById("startHardBtn");
    const checkBtn = document.getElementById("checkBtn");
    const restartBtn = document.getElementById("restartBtn");
    const answerInput = document.getElementById("answer");
    const wordDisplay = document.getElementById("word-display");
    const progress = document.getElementById("progress");
    const feedback = document.getElementById("feedback");
    const timerEl = document.getElementById("timer");
    const completeEl = document.getElementById("complete");

    let sequence = [];
    let currentIndex = 0;
    let startTime = null;
    let timerInterval = null;
    let currentMode = null; // "cifra_facile" | "cifra_difficile"

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const min = Math.floor(elapsed / 60);
      const sec = String(elapsed % 60).padStart(2, "0");
      timerEl.textContent = `${min}:${sec}`;
    }

    function showWord() {
      wordDisplay.textContent = sequence[currentIndex];
      progress.textContent = `${currentIndex + 1} / ${sequence.length}`;
      answerInput.value = "";
      answerInput.className = "";
      feedback.textContent = "";
      feedback.className = "feedback";
      answerInput.focus();
    }

    function startGame(mode) {
      currentMode = mode;
      const pool = mode === "cifra_facile" ? EASY_WORDS : HARD_WORDS;
      sequence = sample(pool, ROUND_SIZE);
      currentIndex = 0;
      startTime = Date.now();
      clearInterval(timerInterval);
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);

      startPanel.style.display = "none";
      gamePanel.style.display = "block";
      restartBtn.style.display = "none";
      completeEl.textContent = "";
      answerInput.style.display = "inline-block";
      checkBtn.style.display = "inline-block";
      showWord();
    }

    function checkAnswer() {
      if (currentIndex >= sequence.length) return;
      const expected = encrypt(sequence[currentIndex]);
      const given = answerInput.value.trim();
      if (given === expected) {
        answerInput.className = "correct";
        feedback.textContent = "";
        currentIndex++;
        if (currentIndex === sequence.length) {
          clearInterval(timerInterval);
          completeEl.textContent = "🎉 " + STRINGS.done + " 🎉";
          restartBtn.style.display = "inline-block";
          wordDisplay.textContent = "";
          progress.textContent = "";
          answerInput.style.display = "none";
          checkBtn.style.display = "none";
          const seconds = (Date.now() - startTime) / 1000;
          if (window.parent !== window) {
            window.parent.postMessage(
              { type: "rev-babel-score", game: currentMode, value: seconds, unit: "s" },
              window.location.origin
            );
          }
        } else {
          setTimeout(showWord, 350);
        }
      } else {
        answerInput.className = "wrong";
        feedback.textContent = STRINGS.wrong;
        feedback.className = "feedback wrong";
      }
    }

    startEasyBtn.addEventListener("click", () => startGame("cifra_facile"));
    startHardBtn.addEventListener("click", () => startGame("cifra_difficile"));
    restartBtn.addEventListener("click", () => startGame(currentMode));
    checkBtn.addEventListener("click", checkAnswer);
    answerInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        checkAnswer();
      }
    });
  </script>
</body>
</html>
