<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impara a usare un chatbot</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 19px; line-height: 1.45; background: #dde3ec; color: #1b1f24; }
  [hidden] { display: none !important; }
  button { font: inherit; }
  .l-it { display: block; }
  .l-other { display: block; font-size: 0.85em; color: #4b5563; font-weight: 500; margin-top: 2px; }

  /* ---- top bar ---- */
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 14px; background: #1d2b4a; color: #fff; }
  .top a { color: #fff; font-weight: 700; text-decoration: none; padding: 6px 10px; border-radius: 8px; background: #2f4170; }
  .top a:hover { background: #3c5290; }
  .top h1 { margin: 0; font-size: 1.15rem; flex: 1 1 14rem; }
  .top h1 .l-other { color: #c9d4ee; }
  .top .lang-select { font-size: 1rem; padding: 4px 6px; border-radius: 6px; }
  .reply { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .reply .lbl { font-weight: 700; }
  .reply .lbl .l-other { color: #c9d4ee; }
  .reply button { padding: 6px 12px; border-radius: 99px; border: 2px solid #8ea3d6; background: transparent; color: #fff; cursor: pointer; font-weight: 600; }
  .reply button[aria-pressed="true"] { background: #ffb347; border-color: #ffb347; color: #1b1f24; }

  /* ---- mission strip ---- */
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; background: #f4f6fa; border-bottom: 1px solid #c3cad8; }
  .strip button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 99px; border: 2px solid #c3cad8; background: #fff; cursor: pointer; font-weight: 700; }
  .strip button.done { border-color: #1e7a3c; color: #1e7a3c; }
  .strip button[aria-current="step"] { background: #1a56c4; border-color: #1a56c4; color: #fff; }

  /* ---- two parts: the mission, the chat ---- */
  .main { display: grid; grid-template-columns: minmax(0, 27rem) minmax(0, 1fr); gap: 10px; padding: 10px; height: calc(100vh - var(--chrome, 112px)); }
  .card { min-height: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); overflow: hidden; }
  .mission-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
  .count { font-size: 0.85rem; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: .03em; }
  .m-title { font-size: 1.45rem; font-weight: 800; margin: 4px 0 10px; }
  .m-title .l-other { font-size: 1.05rem; font-weight: 600; }
  .goal { margin: 0 0 12px; }
  .tip { background: #fff8d6; border: 1px solid #f5b800; border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }
  .compare { display: grid; gap: 8px; margin-bottom: 12px; }
  .ex { border-radius: 10px; padding: 10px 12px; }
  .ex.bad { background: #fdecec; border: 2px solid #e3a0a0; }
  .ex.good { background: #e6f6ea; border: 2px solid #8fcb9f; }
  .ex .tag { font-weight: 800; font-size: 0.9rem; }
  .ex .tag .l-other { display: inline; margin-left: 6px; }
  .ex .q { font-weight: 600; margin-top: 4px; }
  .ex .q .l-it::before, .ex .q .l-it::after { content: "\201C"; color: #6b7280; }
  .ex .q .l-it::after { content: "\201D"; }
  .use { margin-top: 8px; padding: 6px 14px; border-radius: 8px; border: 2px solid #1e7a3c; background: #fff; color: #1e7a3c; font-weight: 700; cursor: pointer; }
  .use:hover { background: #e6f6ea; }
  .why { background: #eef2fb; border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; }
  .why b { display: block; }
  .chips-lbl { font-weight: 700; margin-bottom: 6px; }
  .chips { display: grid; gap: 8px; }
  .chip { text-align: left; padding: 10px 14px; border-radius: 12px; border: 2px solid #1a56c4; background: #f3f7ff; color: #12306e; cursor: pointer; font-weight: 600; }
  .chip:hover, .chip:focus-visible { background: #dfe9ff; }
  .chip .l-other { color: #3b5fa0; }
  .mission-foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid #e0e4ec; }
  .btn { padding: 10px 18px; border-radius: 12px; border: 0; background: #1a56c4; color: #fff; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #12419a; }
  .btn .l-other { color: #dbe6ff; }
  .btn.alt { background: #fff; color: #1a56c4; border: 2px solid #1a56c4; }
  .btn.alt .l-other { color: #3b5fa0; }
  .rules { padding-left: 1.4rem; }
  .rules li { margin-bottom: 10px; font-weight: 600; }
  [dir="rtl"].rules, [dir="rtl"] .rules { padding-left: 0; padding-right: 1.4rem; }

  /* ---- the chat ---- */
  .chat-head { padding: 8px 14px; background: #f8f9fc; border-bottom: 1px solid #e0e4ec; font-size: 0.9rem; }
  .chat-head .privacy { font-weight: 700; color: #8a1c1c; }
  .chat-head .note { color: #4b5563; margin-top: 4px; }
  .offline { padding: 8px 14px; background: #fff4e5; border-bottom: 1px solid #f5b800; font-size: 0.95rem; font-weight: 600; }
  .log { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 14px; list-style: none; display: flex; flex-direction: column; gap: 12px; background: #eef1f6; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .msg.you { align-self: flex-end; background: #1a56c4; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; }
  .msg .who { font-size: 0.8rem; font-weight: 800; margin-bottom: 2px; opacity: .85; }
  .msg .who .ex-tag { margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: #ffe2b0; color: #6b4300; font-weight: 700; }
  .msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg p + p { margin-top: 10px; padding-top: 8px; border-top: 2px dashed #c9d2e3; color: #243b6b; }
  .msg .notice { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: #fff8d6; font-size: 0.9rem; }
  .msg.warn { align-self: stretch; max-width: none; background: #fdecec; border: 2px solid #d64545; }
  .msg.typing p { color: #6b7280; font-style: italic; }
  .compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e0e4ec; background: #fff; }
  .compose textarea { flex: 1; min-height: 3.2em; max-height: 8em; resize: vertical; padding: 10px 12px; font: inherit; border: 2px solid #9aa7bf; border-radius: 12px; }
  .compose textarea:focus { outline: none; border-color: #1a56c4; box-shadow: 0 0 0 3px rgba(26,86,196,.2); }
  .compose .send { align-self: stretch; min-width: 6.5rem; font-size: 1.1rem; }
  .compose .send:disabled { background: #9aa7bf; cursor: wait; }
  .chat-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 12px 8px; background: #fff; font-size: 0.85rem; color: #6b7280; }
  .chat-foot button { background: none; border: 0; padding: 0; color: #1a56c4; text-decoration: underline; cursor: pointer; font-size: 0.9rem; }

  /* Phones and narrow windows: one column, mission first, chat under it. */
  @media (max-width: 900px) {
    body { font-size: 18px; }
    .main { grid-template-columns: 1fr; height: auto; }
    .card.mission .mission-body { overflow: visible; }
    .log { min-height: 18rem; max-height: 60vh; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
  <header class="top" id="top">
    <a href="/course/lezione-6" id="back"></a>
    <h1 id="title"></h1>
    <div class="reply" id="reply" role="group" hidden></div>
    {% include "_lang_select.html" %}
  </header>
  <nav class="strip" id="strip" aria-label="Missioni"></nav>

  <div class="main" id="main">
    <section class="card mission" aria-label="Missione">
      <div class="mission-body" id="mission-body"></div>
      <div class="mission-foot" id="mission-foot"></div>
    </section>

    <section class="card" aria-label="Chat">
      <div class="chat-head" id="chat-head"></div>
      <div class="offline" id="offline" hidden></div>
      <ol class="log" id="log" aria-live="polite"></ol>
      <form class="compose" id="compose" autocomplete="off">
        <textarea id="input" rows="2" maxlength="400" aria-label="Messaggio"></textarea>
        <button type="submit" class="btn send" id="send"></button>
      </form>
      <div class="chat-foot">
        <span id="counter"></span>
        <button type="button" id="clear"></button>
      </div>
    </section>
  </div>

  <script id="tutor-config" type="application/json">{{ tutor_json | safe }}</script>
  <script src="/static/lessons/lezione-6/tutor/tutor.js?v={{ static_version }}"></script>
</body>
</html>
