<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrivi un documento</title>
<link rel="stylesheet" href="/static/vendor/quill/quill.snow.css?v={{ static_version }}">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #dde3ec; color: #1b1f24; overflow: hidden; }

  /* ---- two parts: the word processor, the instructions ---- */
  .tutorial { display: grid; grid-template-columns: minmax(0, 1fr) 27rem; gap: 10px; height: 100vh; padding: 10px; }
  .col { min-height: 0; display: flex; flex-direction: column; border-radius: 12px; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.12); overflow: hidden; }
  .col-head { padding: 10px 14px; font-weight: 700; background: #1d2b4a; color: #fff; }
  .l-it { display: block; }
  .l-other { display: block; font-size: 0.85em; color: #4b5563; font-weight: 500; }
  .col-head .l-other { color: #c9d4ee; }

  /* ---- the word processor ---- */
  /* Tall on purpose: the arrow pointing at a toolbar button needs room above it. */
  .doc-bar { display: flex; align-items: center; padding: 0 14px; min-height: 64px; background: #1d2b4a; color: #fff; font-weight: 700; }
  .privacy { padding: 8px 16px; border-top: 1px solid #e0e4ec; font-size: 0.85rem; color: #4b5563; background: #f8f9fc; }
  #toolbar.ql-toolbar.ql-snow { border: 0; border-bottom: 1px solid #c3cad8; background: #f4f6fa; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  #toolbar.ql-snow .ql-formats { margin-right: 10px; padding-right: 10px; border-right: 1px solid #d3d9e5; display: inline-flex; align-items: center; gap: 2px; }
  #toolbar.ql-snow .ql-formats:last-child { border-right: 0; }
  #toolbar.ql-snow button { width: 40px; height: 36px; border-radius: 6px; }
  #toolbar.ql-snow button svg { width: 22px; height: 22px; }
  #toolbar.ql-snow button:hover { background: #e3e8f1; }
  #toolbar.ql-snow button.ql-active { background: #cfe0ff; }
  #toolbar.ql-snow button.tb-text { width: auto; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.95rem; color: #1b1f24; }
  #toolbar.ql-snow .tb-ico { font-size: 1.3rem; line-height: 1; }
  #toolbar.ql-snow .ql-picker { height: 36px; font-size: 1rem; }
  #toolbar.ql-snow .ql-picker-label { display: inline-flex; align-items: center; border-radius: 6px; }
  #toolbar.ql-snow .ql-picker.ql-header { width: 150px; }
  #toolbar.ql-snow .ql-picker.ql-color { width: 44px; }
  #toolbar.ql-snow .ql-picker.ql-color svg { width: 22px; height: 22px; }
  #toolbar.ql-snow .ql-picker-label:hover, #toolbar.ql-snow .ql-picker.ql-expanded .ql-picker-label { background: #e3e8f1; border-color: transparent; }
  #toolbar.ql-snow .ql-picker-options { z-index: 5; }
  /* The Quill header menu speaks English by default: say it in Italian. */
  .ql-snow .ql-picker.ql-header .ql-picker-label::before,
  .ql-snow .ql-picker.ql-header .ql-picker-item::before { content: 'Testo normale'; }
  .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="1"]::before,
  .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="1"]::before { content: 'Titolo'; }
  .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="2"]::before,
  .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="2"]::before { content: 'Sottotitolo'; }

  #desk { flex: 1; min-height: 0; overflow-y: auto; background: #cfd6e2; padding: 24px; }
  #page { max-width: 820px; margin: 0 auto; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.2); min-height: 100%; }
  #editor.ql-container.ql-snow { border: 0; height: auto; font-size: 20px; }
  #editor .ql-editor { overflow-y: visible; min-height: 62vh; padding: 56px 64px; font-family: Georgia, "Times New Roman", serif; line-height: 1.6; color: #111; }
  #editor .ql-editor.ql-blank::before { font-style: normal; color: #8a93a6; left: 64px; right: 64px; }
  #editor .ql-editor h1 { font-size: 2.1rem; line-height: 1.25; }
  #editor .ql-editor h2 { font-size: 1.6rem; line-height: 1.3; }

  /* ---- the instructions ---- */
  .pane-head { padding: 12px 16px 10px; background: #1d2b4a; color: #fff; }
  .pane-head .step-count { font-weight: 700; }
  .pane-head .step-count .l-other { color: #c9d4ee; }
  .bar { height: 8px; border-radius: 99px; background: #3b4b73; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #ffb347; transition: width .4s; }
  .pane-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
  .step-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 10px; }
  .step-title .l-other { font-size: 1rem; font-weight: 600; }
  .dual .lang-it { font-size: 1.1rem; line-height: 1.5; }
  .dual .lang-other { margin-top: 12px; padding-top: 10px; border-top: 2px dashed #c9d2e3; font-size: 1rem; line-height: 1.55; color: #243b6b; }
  .dual p { margin: 0 0 10px; }
  .dual ol, .dual ul { padding-left: 1.3rem; margin: 0 0 10px; }
  .dual [dir="rtl"] ol, .dual [dir="rtl"] ul { padding-left: 0; padding-right: 1.3rem; }
  .dual li { margin-bottom: 6px; }
  .dual .real { background: #fff4e5; border-radius: 8px; padding: 8px 10px; }
  .dual .ask { background: #e9f6ec; border-radius: 8px; padding: 10px 12px; }
  .dual .tip { background: #eef2fb; border-radius: 8px; padding: 6px 10px; font-size: 0.95rem; }
  kbd { font: 700 0.9em ui-monospace, Consolas, monospace; background: #fff; border: 1px solid #b9c2d3; border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px; direction: ltr; unicode-bidi: isolate; }
  .hint { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: #fff8d6; border: 1px solid #f5b800; }
  .hint[hidden], .result[hidden] { display: none; }
  .hint .hint-head { font-weight: 700; margin-bottom: 4px; }
  .hint .lang-other { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #d9b300; color: #4a3b00; }
  .result { margin-top: 14px; padding: 12px; border-radius: 10px; background: #e6f6ea; border: 2px solid #1e7a3c; text-align: center; }
  .result .ok { font-size: 1.2rem; font-weight: 800; color: #1e7a3c; }
  .result .ok .l-other { color: #1e7a3c; }
  .btn-big { display: block; margin: 10px auto 0; padding: 12px 26px; font-size: 1.1rem; font-weight: 700; border: 0; border-radius: 12px; background: #1a56c4; color: #fff; cursor: pointer; }
  .btn-big:hover { background: #12419a; }
  .btn-big .l-other { color: #dbe6ff; text-align: center; }
  .btn-alt { background: #fff; color: #1a56c4; border: 2px solid #1a56c4; }
  .btn-alt:hover { background: #eef3ff; }
  .btn-alt .l-other { color: #3b5fa0; }
  .pane-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 10px 16px; border-top: 1px solid #e0e4ec; font-size: 0.9rem; }
  .pane-foot a, .link-btn { color: #1a56c4; text-decoration: underline; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; }
  .pane-foot [hidden] { display: none; }

  /* ---- the orange arrow and the pulsing frame ---- */
  #arrow, #spot { position: fixed; z-index: 60; pointer-events: none; display: none; }
  #spot { border: 4px solid #ff8a00; border-radius: 10px; box-shadow: 0 0 0 4px rgba(255,138,0,.28); animation: pulse 1.2s ease-in-out infinite; }
  #arrow { width: 52px; height: 52px; filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
  #arrow svg { width: 100%; height: 100%; display: block; }
  #arrow.side-top svg { animation: bob-y 0.8s ease-in-out infinite; }
  #arrow.side-bottom svg { transform: rotate(180deg); animation: bob-y-rev 0.8s ease-in-out infinite; }
  #arrow.side-left svg { transform: rotate(-90deg); animation: bob-x 0.8s ease-in-out infinite; }
  #arrow.side-right svg { transform: rotate(90deg); animation: bob-x-rev 0.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(255,138,0,.1); } }
  @keyframes bob-y { 50% { translate: 0 8px; } }
  @keyframes bob-y-rev { 50% { translate: 0 -8px; } }
  @keyframes bob-x { 50% { translate: 8px 0; } }
  @keyframes bob-x-rev { 50% { translate: -8px 0; } }
  @media (prefers-reduced-motion: reduce) { #arrow svg, #spot { animation: none !important; } }

  /* ---- intro / final card ---- */
  #overlay { position: fixed; inset: 0; background: rgba(20, 30, 55, .72); display: grid; place-items: center; padding: 20px; z-index: 100; }
  #overlay[hidden] { display: none; }
  .overlay-card { background: #fff; border-radius: 18px; padding: 26px 30px; max-width: 46rem; width: 100%; max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .o-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
  .o-title .l-other { font-size: 1.1rem; font-weight: 600; }
  .o-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  @media (max-width: 1000px) {
    body { overflow: auto; }
    .tutorial { grid-template-columns: 1fr; height: auto; }
    #desk { max-height: 70vh; }
    .col.pane { min-height: 22rem; }
  }
</style>
</head>
<body>
  <div class="tutorial">
    <section class="col editor-col" aria-label="Documento">
      <div class="doc-bar"><span id="doc-name"></span></div>
      <div id="toolbar">
        <span class="ql-formats">
          <button type="button" class="ql-undo tb-text" data-tb="tb_undo"><span class="tb-ico">↶</span><span>Annulla</span></button>
          <button type="button" class="ql-redo tb-text" data-tb="tb_redo"><span class="tb-ico">↷</span><span>Ripristina</span></button>
        </span>
        <span class="ql-formats">
          <select class="ql-header" data-tb="tb_header">
            <option value="1">Titolo</option>
            <option value="2">Sottotitolo</option>
            <option selected>Testo normale</option>
          </select>
        </span>
        <span class="ql-formats">
          <button type="button" class="ql-bold" data-tb="tb_bold"></button>
          <button type="button" class="ql-italic" data-tb="tb_italic"></button>
          <button type="button" class="ql-underline" data-tb="tb_underline"></button>
          <select class="ql-color" data-tb="tb_color">
            <option selected></option>
            <option value="#d62828"></option>
            <option value="#f77f00"></option>
            <option value="#2b9348"></option>
            <option value="#1a56c4"></option>
            <option value="#7b2cbf"></option>
          </select>
        </span>
        <span class="ql-formats">
          <button type="button" class="ql-align" value="" data-tb="tb_left"></button>
          <button type="button" class="ql-align" value="center" data-tb="tb_center"></button>
          <button type="button" class="ql-align" value="right" data-tb="tb_right"></button>
        </span>
        <span class="ql-formats">
          <button type="button" class="ql-list" value="bullet" data-tb="tb_bullet"></button>
          <button type="button" class="ql-list" value="ordered" data-tb="tb_ordered"></button>
        </span>
      </div>
      <div id="desk">
        <div id="page"><div id="editor"></div></div>
      </div>
    </section>

    <section class="col pane" aria-label="Istruzioni">
      <div class="pane-head">
        <div class="step-count" id="step-count"></div>
        <div class="bar"><i id="bar-fill"></i></div>
      </div>
      <div class="pane-body" id="pane-body">
        <div class="step-title" id="step-title"></div>
        <div id="step-body"></div>
        <div class="hint" id="step-hint" hidden></div>
        <div class="result" id="step-result" hidden></div>
      </div>
      <div class="privacy" id="privacy"></div>
      <div class="pane-foot">
        <a href="/course/lezione-5" id="back-link"></a>
        <button type="button" class="link-btn" id="skip-btn"></button>
      </div>
    </section>
  </div>

  <div id="spot"></div>
  <div id="arrow" aria-hidden="true">
    <svg viewBox="0 0 52 52"><path d="M26 49 L5 24 H17 V3 H35 V24 H47 Z" fill="#ff8a00" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
  </div>
  <div id="overlay" hidden></div>

  <script id="doc-config" type="application/json">{{ {"lang": lang, "rtl": is_rtl} | tojson }}</script>
  <script id="doc-strings" type="application/json">{{ doc_strings_json | safe }}</script>
  <script src="/static/vendor/quill/quill.js?v={{ static_version }}"></script>
  <script src="/static/lessons/lezione-5/documento/tutorial.js?v={{ static_version }}"></script>
</body>
</html>
