<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entra con SPID!</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #dde3ec; color: #1b1f24; overflow: hidden; }

  /* ---- three columns: the fake browser, the explanation, the task list ---- */
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 24rem 19rem; gap: 10px; height: 100vh; padding: 10px; }
  .col { min-height: 0; display: flex; flex-direction: column; border-radius: 12px; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.12); overflow: hidden; }
  .col-head { padding: 10px 14px; font-weight: 700; background: #1d2b4a; color: #fff; }
  .col-head .l-other { color: #c9d4ee; font-weight: 500; }
  .col-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }
  .l-it { display: block; }
  .l-other { display: block; font-size: 0.85em; color: #4b5563; font-weight: 500; }

  /* ---- the fake browser ---- */
  .browser { background: #cfd6e2; }
  .sim-bar { background: #fff3c4; text-align: center; padding: 5px; font-size: 0.82rem; font-weight: 600; }
  .tabs { background: #cfd6e2; padding: 8px 10px 0; }
  .tab { display: inline-block; background: #f4f6fa; padding: 7px 16px; border-radius: 8px 8px 0 0; font-size: 0.85rem; max-width: 18rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav { background: #f4f6fa; display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid #c3cad8; }
  .nav button { border: 0; background: #e3e8f1; border-radius: 50%; width: 2rem; height: 2rem; font-size: 1.1rem; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .addr { flex: 1; background: #fff; border: 1px solid #c3cad8; border-radius: 999px; padding: 6px 14px; font-size: 0.92rem; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #viewport { flex: 1; min-height: 0; overflow-y: auto; background: #fff; }

  /* ---- right panes ---- */
  .dual .lang-it { font-size: 1.05rem; line-height: 1.5; }
  .dual .lang-other { margin-top: 12px; padding-top: 10px; border-top: 2px dashed #c9d2e3; font-size: 1rem; line-height: 1.55; color: #243b6b; font-weight: 400; }
  .dual h3 { margin: 0 0 8px; font-size: 1.15rem; }
  .dual p { margin: 0 0 10px; }
  .dual ol, .dual ul { padding-left: 1.3rem; margin: 0 0 10px; }
  .dual [dir="rtl"] ol, .dual [dir="rtl"] ul { padding-left: 0; padding-right: 1.3rem; }
  .dual li { margin-bottom: 6px; }
  .dual .real { background: #fff4e5; border-radius: 8px; padding: 8px 10px; }
  .dual .ask { background: #e9f6ec; border-radius: 8px; padding: 10px 12px; font-size: 1.1rem; }
  .pane-sep { border: 0; border-top: 3px solid #1d2b4a; margin: 16px 0; }
  .creds { background: #f4f1ff; border: 2px solid #5b3fc4; border-radius: 12px; padding: 10px 14px; margin: 8px 0 12px; }
  .creds div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 0; }
  .creds span { color: #555; }
  .creds b { font-family: ui-monospace, Consolas, monospace; font-size: 1.5rem; letter-spacing: .04em; direction: ltr; unicode-bidi: isolate; }

  /* ---- task list ---- */
  #task-list { list-style: none; margin: 0; padding: 0; }
  .task { border: 2px solid #d5dbe7; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: #f8f9fc; }
  .task.is-idle { opacity: .6; }
  .task.is-current { border-color: #1a56c4; background: #fff; }
  .task.is-done { border-color: #1e7a3c; background: #e6f6ea; opacity: 1; }
  .task-head { display: flex; gap: 10px; align-items: flex-start; }
  .task-num { flex: 0 0 1.8rem; height: 1.8rem; border-radius: 50%; background: #9aa5bd; color: #fff; display: grid; place-items: center; font-weight: 700; }
  .is-current .task-num { background: #1a56c4; }
  .is-done .task-num { background: #1e7a3c; }
  .task-title { font-weight: 700; font-size: 0.95rem; }
  .subtasks { list-style: none; padding: 0; margin: 10px 0 0; }
  .subtasks li { display: flex; gap: 8px; padding: 5px 4px; font-size: 0.9rem; border-radius: 6px; }
  .subtasks .tick { flex: 0 0 1.2rem; text-align: center; color: #888; }
  .subtasks .sub-done { color: #1e7a3c; }
  .subtasks .sub-done .tick { color: #1e7a3c; font-weight: 700; }
  .subtasks .sub-done .sub-text { text-decoration: line-through; text-decoration-color: #9bd1ac; }
  .subtasks .sub-now { background: #fff8d6; font-weight: 600; }
  .subtasks .sub-now .tick { color: #1a56c4; }
  .task .l-other { font-weight: 400; }

  /* ---- overlay (rules, splash) ---- */
  #overlay { position: fixed; inset: 0; background: rgba(20, 30, 55, .72); display: grid; place-items: center; padding: 20px; z-index: 10; }
  #overlay[hidden] { display: none; }
  .overlay-card { background: #fff; border-radius: 18px; padding: 26px 30px; max-width: 46rem; width: 100%; max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .o-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
  .o-title .l-other { font-size: 1.1rem; font-weight: 600; }
  .confetti { font-size: 2.6rem; text-align: center; margin-bottom: 6px; }
  .btn-big { display: block; margin: 18px auto 0; padding: 14px 30px; font-size: 1.15rem; font-weight: 700; border: 0; border-radius: 12px; background: #1a56c4; color: #fff; cursor: pointer; }
  .btn-big:hover { background: #12419a; }
  .btn-big .l-other { color: #dbe6ff; }
  .btn-big .l-it, .btn-big .l-other { text-align: center; }

  /* ---- fake pages ---- */
  .page { min-height: 100%; }
  .muted { color: #6b7280; } .small { font-size: 0.85rem; }
  .big { font-size: 3rem; }
  .center-msg { display: grid; place-content: center; text-align: center; padding: 40px; gap: 6px; }
  /* search engine */
  .search { padding: 8vh 6% 30px; text-align: center; background: #fff; }
  .search.with-results { padding-top: 3vh; text-align: left; }
  .logo { font-size: 3rem; font-weight: 800; color: #3a56d4; letter-spacing: -1px; margin-bottom: 18px; }
  .logo span { color: #e8803a; }
  .with-results .logo { font-size: 1.8rem; margin-bottom: 8px; }
  .search-form { display: flex; gap: 8px; max-width: 38rem; margin: 0 auto; }
  .with-results .search-form { margin: 0; }
  .search-form input { flex: 1; font-size: 1.15rem; padding: 12px 18px; border: 2px solid #ccd3e0; border-radius: 999px; outline: none; }
  .search-form input:focus { border-color: #3a56d4; }
  .search-form button { font-size: 1.05rem; padding: 0 22px; border: 0; border-radius: 999px; background: #3a56d4; color: #fff; cursor: pointer; font-weight: 600; }
  .results { max-width: 40rem; margin-top: 22px; text-align: left; }
  .result { margin-bottom: 22px; }
  .r-url { color: #1e7a3c; font-size: 0.85rem; }
  .r-title { color: #1a0dab; font-size: 1.25rem; text-decoration: none; }
  .r-title:hover { text-decoration: underline; }
  .r-snip { color: #4d5156; margin-top: 3px; }
  .no-results { color: #555; font-size: 1.1rem; }
  /* service sites */
  .s-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; color: #fff; position: relative; }
  .s-name { font-size: 1.35rem; font-weight: 700; }
  .s-user { display: flex; align-items: center; gap: 14px; }
  .s-user small { opacity: .8; }
  .exit-btn { background: #fff; color: #222; border: 0; border-radius: 8px; padding: 8px 18px; font-weight: 700; cursor: pointer; }
  .s-menu { position: relative; }
  .s-menubtn { background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 9px 16px; font-size: 1rem; cursor: pointer; }
  .s-drop { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; color: #222; border-radius: 10px; padding: 12px; width: 15rem; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 2; }
  .s-layout { display: flex; gap: 22px; padding: 18px 22px; }
  .s-main { flex: 1; min-width: 0; }
  .s-side { flex: 0 0 15rem; background: #f3f0fa; border-radius: 12px; padding: 14px; align-self: flex-start; display: flex; flex-direction: column; gap: 8px; }
  .s-side h3, .login-box h3, .s-foot h3 { margin: 0; }
  .s-nav { display: flex; gap: 18px; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid #e0e4ec; }
  .s-nav a { color: #1a56c4; text-decoration: none; }
  .login-box { background: #eef6ff; border: 1px solid #c4dcf6; border-radius: 12px; padding: 16px; margin-top: 16px; max-width: 24rem; display: flex; flex-direction: column; gap: 8px; }
  .s-foot { background: #eef0f6; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; max-width: 24rem; margin: 26px 22px; border-radius: 12px; }
  .filler { font-weight: 700; margin-top: 18px; } .filler-list { color: #444; line-height: 1.8; margin-bottom: 40px; }
  .spid-btn, .cie-btn { padding: 11px 16px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
  .spid-btn { background: #0066cc; color: #fff; border: 0; }
  .cie-btn { background: #fff; color: #333; border: 1px solid #aab; }
  /* SPID pages */
  .spid { background: #eef1f6; display: grid; place-items: start center; padding: 6vh 16px; }
  .spid-card { background: #fff; border-radius: 14px; padding: 26px 30px; width: min(30rem, 100%); box-shadow: 0 6px 22px rgba(0,0,0,.12); text-align: center; }
  .spid-card h2 { margin-top: 0; }
  .providers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .provider { padding: 14px; font-size: 1.05rem; border: 2px solid #ccd3e0; border-radius: 10px; background: #fff; cursor: pointer; font-weight: 600; }
  .provider:hover { border-color: #0066cc; background: #eef6ff; }
  .login { text-align: left; }
  .gestore { font-weight: 800; color: #0066cc; font-size: 1.3rem; } .gestore small { color: #888; font-weight: 400; }
  .login label { display: block; margin: 12px 0 4px; font-weight: 600; }
  .login input { width: 100%; padding: 11px 12px; font-size: 1.1rem; border: 2px solid #ccd3e0; border-radius: 8px; }
  .login input:focus { border-color: #0066cc; outline: none; }
  .pw { position: relative; } .pw input { padding-right: 3rem; }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 1.3rem; cursor: pointer; }
  .form-msg { color: #b3261e; font-weight: 600; min-height: 1.4rem; margin-top: 10px; }
  .enter { margin-top: 14px; width: 100%; padding: 13px; font-size: 1.1rem; font-weight: 700; border: 0; border-radius: 8px; background: #0066cc; color: #fff; cursor: pointer; }
  .helpbtn { width: 100%; padding: 11px; margin-top: 6px; background: #fff8d6; border: 2px solid #f5b800; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .qr-box { width: 15rem; margin: 14px auto; } .qr-box svg { width: 100%; height: auto; display: block; }
  .qr-url { font-family: ui-monospace, Consolas, monospace; background: #f4f6fa; padding: 8px 10px; border-radius: 8px; font-size: 1rem; word-break: break-all; direction: ltr; }
  .waiting { margin-top: 18px; color: #345; font-weight: 600; }
  .spin { display: inline-block; width: 1em; height: 1em; border: 3px solid #cbd5e6; border-top-color: #0066cc; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -0.15em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* logged-in service UI */
  .doc-list { list-style: none; padding: 0; } .doc-list li { padding: 12px 14px; border: 1px solid #dde2ec; border-radius: 10px; margin-bottom: 8px; }
  .doc-list a { color: #1a56c4; text-decoration: none; font-weight: 600; font-size: 1.05rem; }
  .doc-view { background: #f7faf5; border: 1px solid #cfe5c8; border-radius: 10px; padding: 12px 16px; margin-top: 12px; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .card { padding: 14px 18px; font-size: 1rem; border: 2px solid #ccd3e0; border-radius: 10px; background: #fff; cursor: pointer; }
  .card.sel { border-color: #1a56c4; background: #eef6ff; font-weight: 700; }
  .row { margin: 16px 0 6px; }
  .primary { padding: 11px 22px; font-size: 1.05rem; font-weight: 700; border: 0; border-radius: 8px; background: #1a56c4; color: #fff; cursor: pointer; }
  .flash { display: none; padding: 10px 14px; border-radius: 8px; background: #fff8d6; border: 1px solid #f5b800; margin: 12px 0; font-weight: 600; }
  .flash.show { display: block; }
  .tbl { border-collapse: collapse; width: 100%; } .tbl th, .tbl td { text-align: left; padding: 10px; border-bottom: 1px solid #e3e7ef; }
  .form-grid { display: grid; grid-template-columns: 11rem 1fr; gap: 10px 14px; max-width: 34rem; align-items: center; }
  .form-grid select { padding: 10px; font-size: 1rem; border: 2px solid #ccd3e0; border-radius: 8px; }
  .foot { margin-top: 30px; }

  @media (max-width: 1100px) {
    body { overflow: auto; }
    .game { grid-template-columns: 1fr; height: auto; }
    .col { min-height: 24rem; }
  }
</style>
</head>
<body>
  <div class="game">
    <section class="col browser" aria-label="Browser finto">
      <div class="sim-bar">🎮 GIOCO · I siti qui sono finti · Nessun dato è vero</div>
      <div class="tabs"><span class="tab" id="tab-title">Cercatutto</span></div>
      <div class="nav">
        <button id="btn-back" title="Indietro" aria-label="Indietro" disabled>←</button>
        <div class="addr">🔒 <span id="addr-text">cercatutto.example</span></div>
      </div>
      <div id="viewport"></div>
    </section>
    <section class="col" aria-label="Spiegazione">
      <div class="col-head" id="pane-head"></div>
      <div class="col-body" id="pane-body"></div>
    </section>
    <section class="col" aria-label="Compiti">
      <div class="col-head" id="tasks-head"></div>
      <div class="col-body"><ol id="task-list"></ol></div>
    </section>
  </div>
  <div id="overlay" hidden></div>

  <script id="spid-config" type="application/json">{{ {"lang": lang, "rtl": is_rtl, "studentId": student_id} | tojson }}</script>
  <script id="spid-strings" type="application/json">{{ spid_strings_json | safe }}</script>
  <script src="/static/lessons/lezione-4/spid/fuzzy.js?v={{ static_version }}"></script>
  <script src="/static/lessons/lezione-4/spid/game.js?v={{ static_version }}"></script>
</body>
</html>
