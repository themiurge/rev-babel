<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rev-babel — presenter</title>
  <style>
    /* Several rules below (notably `iframe { display: block }`) set
       `display` on a selector that beats the browser's built-in
       [hidden] rule on cascade origin, which would otherwise silently
       stop `el.hidden = true` from hiding anything. */
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 0.6rem 1rem;
      background: #1c1c1c;
      border-bottom: 1px solid #333;
      font-size: 0.95rem;
    }
    .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: #666; display: inline-block; }
    .dot.ok { background: #22c55e; }
    .dot.warn { background: #eab308; }
    .dot.bad { background: #ef4444; }
    .topbar button {
      background: #2c2c2c;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
    }
    .topbar button:hover { background: #3a3a3a; }
    .spacer { flex: 1 1 auto; }
    main { flex: 1 1 auto; position: relative; }
    iframe { width: 100%; height: 100%; border: none; pointer-events: none; display: block; }
    #setup {
      max-width: 28rem;
      margin: 10vh auto;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 1.5rem;
    }
    #setup h1 { margin-top: 0; font-size: 1.3rem; }
    #setup label { display: block; margin-top: 0.8rem; font-size: 0.9rem; color: #aaa; }
    #setup input {
      width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.3rem;
      background: #111; color: #eee; border: 1px solid #444; border-radius: 6px;
    }
    #setup button {
      margin-top: 1.2rem; padding: 0.6rem 1.2rem; background: #22c55e; color: #041014;
      border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
    }
    #setup select {
      width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.3rem;
      background: #111; color: #eee; border: 1px solid #444; border-radius: 6px;
    }
    .or-divider {
      margin: 1.4rem 0 0.4rem; text-align: center; color: #777; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    #local-slide {
      width: 100%; height: 100%; box-sizing: border-box; overflow: auto;
      background: #fff; color: #111; padding: 3rem 4rem; font-size: 1.6rem; line-height: 1.5;
    }
    #local-slide h1 { margin-top: 0; }
    /* Deck content vocabulary - kept in sync with the equivalent
       .slide-box rules in static/style.css, since this page doesn't
       load that stylesheet (its own dark theme would clash with it). */
    #local-slide .lead { font-size: 1.05em; color: #555; }
    #local-slide .note { font-size: 0.95em; color: #444; }
    #local-slide .note.strong { font-weight: 700; color: #111; }
    #local-slide .chip-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1rem 0; }
    #local-slide .chip {
      display: inline-block; padding: 0.4rem 0.9rem; border-radius: 999px;
      font-weight: 600; font-size: 0.85em; border: 1px solid transparent;
    }
    #local-slide .chip-blue { background: #e8f0fe; color: #1a56c4; border-color: #c3d9fb; }
    #local-slide .chip-green { background: #e6f4ea; color: #1e7a3c; border-color: #bfe3cb; }
    #local-slide .chip-purple { background: #f1eafc; color: #6b3fc7; border-color: #ddccf7; }
    #local-slide .chip-orange { background: #fdece6; color: #c0472b; border-color: #f8cdbc; }
    #local-slide .compare-row { display: flex; gap: 1rem; margin: 1rem 0; }
    #local-slide .compare-col {
      flex: 1 1 0; min-width: 0; border-radius: 10px; padding: 0.8rem 1rem; box-sizing: border-box;
    }
    #local-slide .compare-col.weak { background: #fdf1f0; border: 1px solid #f3c9c4; }
    #local-slide .compare-col.strong { background: #eef7ef; border: 1px solid #c3e3c8; }
    #local-slide .compare-col h2 { font-size: 1em; margin: 0 0 0.5rem; }
    #local-slide .pw-example {
      font-family: ui-monospace, "SF Mono", Consolas, monospace; background: #fff;
      border: 1px solid #ddd; border-radius: 6px; padding: 0.3rem 0.6rem;
      margin: 0.3rem 0; font-size: 0.95em;
    }
    #local-slide .vowel-map { display: flex; flex-wrap: wrap; gap: 1.2rem 2.5rem; margin: 1rem 0; }
    #local-slide .vowel-pair {
      display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.1em;
    }
    #local-slide .letter, #local-slide .digit {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 6px;
    }
    #local-slide .letter { background: #f1eafc; color: #6b3fc7; }
    #local-slide .digit { background: #5b3fc4; color: #fff; }
    #local-slide .word-transform {
      display: flex; align-items: center; gap: 0.4rem; margin: 1rem 0; flex-wrap: wrap;
    }
    #local-slide .tile {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2.2rem; height: 2.2rem; border-radius: 6px; font-weight: 700;
      background: #eee; color: #333;
    }
    #local-slide .tile-out { background: #d9f0e0; color: #1e7a3c; }
    #local-slide .arrow { color: #888; font-weight: 700; }
    #local-slide .signal-list { display: flex; flex-direction: column; gap: 0.7rem; margin: 1rem 0; }
    #local-slide .signal { display: flex; gap: 0.8rem; align-items: flex-start; }
    #local-slide .signal-num {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
      width: 1.8rem; height: 1.8rem; border-radius: 50%; background: #fdece6;
      color: #c0472b; font-weight: 700;
    }
    #local-slide .signal strong { display: block; margin-bottom: 0.2rem; }
    #local-slide .mock-phone { max-width: 22rem; margin: 1rem auto; }
    #local-slide .mock-phone-header { font-size: 0.85rem; color: #666; margin-bottom: 0.3rem; text-align: center; }
    #local-slide .mock-sender { font-weight: 600; color: #333; }
    #local-slide .mock-bubble { background: #e9e9eb; border-radius: 18px; padding: 0.7rem 1rem; font-size: 1.05rem; line-height: 1.4; }
    #local-slide .mock-email {
      max-width: 30rem; margin: 1rem auto; border: 1px solid #ddd; border-radius: 8px;
      overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: left;
    }
    #local-slide .mock-email-header {
      background: #f5f5f5; padding: 0.6rem 1rem; font-size: 0.9rem; color: #333;
      border-bottom: 1px solid #ddd; word-break: break-all;
    }
    #local-slide .mock-email-label { color: #888; margin-right: 0.3rem; }
    #local-slide .mock-email-body { padding: 1rem; font-size: 1.05rem; line-height: 1.5; }
    #local-slide .mock-call {
      max-width: 20rem; margin: 1rem auto; background: #1c1c1c; color: #fff;
      border-radius: 16px; padding: 1.5rem 1.2rem; text-align: center;
    }
    #local-slide .mock-call-avatar { font-size: 2.5rem; margin-bottom: 0.4rem; }
    #local-slide .mock-call-label { font-size: 0.9rem; color: #aaa; margin-bottom: 0.8rem; }
    #local-slide .mock-call-quote { font-style: italic; font-size: 1.05rem; line-height: 1.4; }
    #local-slide .verdict-badge {
      display: inline-block; padding: 0.5rem 1.2rem; border-radius: 999px;
      font-weight: 700; font-size: 1.1rem; margin: 1rem 0 0.6rem;
    }
    #local-slide .verdict-badge.scam { background: #fdece6; color: #c0392b; }
    #local-slide .verdict-badge.safe { background: #e6f4ea; color: #1e7a3c; }
    #local-slide .mock-compose {
      max-width: 30rem; margin: 1rem auto; border: 1px solid #ddd; border-radius: 8px;
      overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); text-align: left; background: #fff;
    }
    #local-slide .compose-row {
      display: flex; gap: 0.6rem; padding: 0.5rem 1rem; border-bottom: 1px solid #eee;
      font-size: 1rem; word-break: break-all;
    }
    #local-slide .compose-row.hl, #local-slide .compose-body.hl {
      background: #fff8d6; box-shadow: inset 4px 0 0 #f5b800;
    }
    #local-slide .compose-label { flex: 0 0 5.5rem; color: #888; }
    #local-slide .compose-value { font-weight: 600; color: #111; }
    #local-slide .compose-body { padding: 1rem; font-size: 1.05rem; line-height: 1.5; }
    #local-slide .compose-attach {
      display: inline-block; margin: 0 1rem 1rem; padding: 0.4rem 0.8rem; border: 1px solid #ddd;
      border-radius: 8px; background: #f5f5f5; font-size: 0.95rem;
    }
    #local-slide .compose-attach.hl { background: #fff8d6; border-color: #f5b800; }
    #local-slide .mock-btn {
      display: block; max-width: 22rem; margin: 0.6rem auto; padding: 0.7rem 1rem;
      border: 1px solid #ccc; border-radius: 999px; background: #fff; font-weight: 600; text-align: center;
    }
    #local-slide .mock-btn.dark { background: #111; color: #fff; border-color: #111; }
    #local-slide .mock-btn.hl { background: #fff8d6; border-color: #f5b800; }
    /* ---- Lesson 5 deck vocabulary: a picture-first storyboard format.
       A day-map strip (.route), picture cards (.pic), a miniature word
       processor (.wp) with the one button to press marked .hl, keycaps,
       comic panels (.panel), a miniature CV page (.mini-page), a print
       dialog (.mock-print) and "your turn" cards (.handoff). Mockups are
       forced left-to-right: a toolbar does not mirror in Arabic or Sorani. ---- */

    #local-slide .route { display: flex; gap: 0.4rem; margin: 0 0 1rem; font-size: 0.6em; }
    #local-slide .route .stop {
      flex: 1 1 0; min-width: 0; text-align: center; padding: 0.35rem 0.2rem;
      border-radius: 999px; background: #eee; color: #777; font-weight: 600;
    }
    #local-slide .route .stop.done { background: #e6f4ea; color: #1e7a3c; }
    #local-slide .route .stop.now { background: #1a56c4; color: #fff; }

    #local-slide .pic-grid { display: flex; flex-wrap: wrap; gap: 0.8rem; margin: 1rem 0; }
    #local-slide .pic {
      flex: 1 1 40%; min-width: 7rem; text-align: center; padding: 0.8rem 0.5rem;
      border-radius: 14px; background: #f5f7fb; border: 1px solid #dfe5f1;
      font-weight: 600; box-sizing: border-box;
    }
    #local-slide .pic-emoji { display: block; font-size: 2.6em; line-height: 1.2; }
    #local-slide .pic small { display: block; font-weight: 400; color: #555; font-size: 0.75em; margin-top: 0.2rem; }
    #local-slide .pic.blue { background: #e8f0fe; border-color: #c3d9fb; }
    #local-slide .pic.green { background: #e6f4ea; border-color: #bfe3cb; }
    #local-slide .pic.purple { background: #f1eafc; border-color: #ddccf7; }
    #local-slide .pic.orange { background: #fdece6; border-color: #f8cdbc; }

    #local-slide .big { text-align: center; font-size: 1.5em; font-weight: 700; margin: 1rem 0; }
    #local-slide .big-emoji { text-align: center; font-size: 4.5em; line-height: 1.1; margin: 0.5rem 0; }

    #local-slide kbd {
      display: inline-block; min-width: 1.6em; padding: 0.15em 0.55em; text-align: center;
      font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 0.9em; font-weight: 700;
      color: #222; background: #f7f7f7; border: 1px solid #bbb; border-bottom-width: 3px;
      border-radius: 6px; direction: ltr; unicode-bidi: isolate;
    }
    #local-slide .keys { text-align: center; font-size: 1.6em; margin: 1rem 0; direction: ltr; }
    #local-slide .keys .plus { color: #888; margin: 0 0.3rem; font-weight: 700; }

    /* the miniature word processor */
    #local-slide .wp {
      max-width: 34rem; margin: 1rem auto; border: 1px solid #cfd4dc; border-radius: 10px;
      overflow: hidden; background: #e9ecf1; direction: ltr; text-align: left;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    #local-slide .wp-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; padding: 0.45rem 0.6rem;
      background: #f8f9fb; border-bottom: 1px solid #d5d9e0;
    }
    #local-slide .wp-btn {
      display: inline-flex; align-items: center; justify-content: center; min-width: 2em; height: 2em;
      padding: 0 0.4em; border: 1px solid #d0d4db; border-radius: 6px; background: #fff;
      font-size: 0.85em; font-weight: 700; color: #333;
    }
    #local-slide .wp-btn.hl { background: #fff8d6; border-color: #f5b800; box-shadow: 0 0 0 3px rgba(245, 184, 0, 0.35); }
    #local-slide .wp-sep { width: 1px; height: 1.6em; background: #d5d9e0; margin: 0 0.2rem; }
    #local-slide .wp-page {
      background: #fff; margin: 0.7rem auto; width: 88%; padding: 0.9rem 1.1rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); font-size: 0.8em; line-height: 1.55; color: #222;
    }
    #local-slide .wp-page .sel { background: #b8d6fb; }
    #local-slide .wp-page .wp-h { font-size: 1.35em; font-weight: 700; text-align: center; }
    #local-slide .wp-label { font-size: 0.55em; color: #888; text-align: center; padding-bottom: 0.4rem; }

    /* picking the right click */
    #local-slide .clicks { display: flex; flex-direction: column; gap: 0.6rem; margin: 1rem 0; direction: ltr; text-align: left; }
    #local-slide .click-row { display: flex; align-items: center; gap: 0.8rem; }
    #local-slide .click-n {
      flex: 0 0 auto; min-width: 3.4em; white-space: nowrap; text-align: center; padding: 0.25rem 0.7rem; border-radius: 999px;
      background: #1a56c4; color: #fff; font-weight: 700; font-size: 0.8em;
    }
    #local-slide .click-line { flex: 1 1 auto; font-size: 0.85em; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 0.3rem 0.6rem; }
    #local-slide .click-line .sel { background: #b8d6fb; }
    #local-slide .click-line .caret { border-left: 2px solid #222; margin: 0 1px; }

    /* comic panels */
    #local-slide .panels { display: flex; flex-wrap: wrap; gap: 0.8rem; margin: 1rem 0; }
    #local-slide .panel {
      flex: 1 1 28%; min-width: 7.5rem; border: 2px solid #333; border-radius: 10px; background: #fffdf5;
      padding: 0.6rem; text-align: center; box-sizing: border-box; position: relative;
    }
    #local-slide .panel-n {
      position: absolute; top: -0.7rem; left: 0.5rem; background: #333; color: #fff; border-radius: 999px;
      width: 1.5rem; height: 1.5rem; font-size: 0.75em; font-weight: 700; display: flex;
      align-items: center; justify-content: center;
    }
    #local-slide .panel-art { font-size: 3em; line-height: 1.2; }
    #local-slide .panel-art.sm { font-size: 1.5em; padding: 0.5rem 0; overflow-wrap: anywhere; }
    #local-slide .panel-art .keys { font-size: 0.55em; margin: 0; white-space: nowrap; }
    #local-slide .panel-cap { font-size: 0.85em; font-weight: 600; margin-top: 0.3rem; }
    #local-slide .bubble {
      display: inline-block; background: #fff; border: 2px solid #333; border-radius: 16px;
      padding: 0.35rem 0.7rem; font-size: 0.8em; font-weight: 600; margin-top: 0.3rem;
    }

    /* a miniature CV page, parts coloured like the chips */
    #local-slide .mini-wrap { display: flex; gap: 1.2rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; justify-content: center; direction: ltr; }
    #local-slide .mini-page {
      flex: 0 0 auto; width: 9.5rem; padding: 0.7rem 0.6rem; background: #fff; border: 1px solid #ccc;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15); display: flex; flex-direction: column; gap: 0.35rem;
    }
    #local-slide .mini-page .ln { height: 0.35rem; border-radius: 3px; background: #d9d9d9; }
    #local-slide .mini-page .ln.s { width: 60%; }
    #local-slide .mini-page .ln.c { margin: 0 auto; width: 55%; }
    #local-slide .mini-page .ttl { height: 0.7rem; border-radius: 3px; width: 70%; margin: 0 auto 0.2rem; background: #1a56c4; }
    #local-slide .mini-page .hd { height: 0.45rem; border-radius: 3px; width: 45%; background: #333; margin-top: 0.3rem; }
    #local-slide .mini-page .dot-ln { height: 0.35rem; border-radius: 3px; background: #d9d9d9; margin-left: 0.7rem; position: relative; }
    #local-slide .mini-page .dot-ln::before { content: ""; position: absolute; left: -0.6rem; top: 0; width: 0.35rem; height: 0.35rem; border-radius: 50%; background: #333; }
    #local-slide .mini-page.messy .ln { background: #cfcfcf; width: 100%; }
    #local-slide .mini-page.messy .ln.s { width: 100%; }
    #local-slide .parts { display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.85em; text-align: start; }
    #local-slide .part { display: flex; align-items: center; gap: 0.6rem; }
    #local-slide .part-n {
      flex: 0 0 auto; width: 1.7em; height: 1.7em; border-radius: 50%; background: #1a56c4; color: #fff;
      font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 0.9em;
    }
    #local-slide .part-n.g { background: #1e7a3c; }
    #local-slide .part-n.p { background: #6b3fc7; }
    #local-slide .part-n.o { background: #c0472b; }

    /* a "your turn" card */
    #local-slide .handoff {
      border: 3px dashed #1a56c4; border-radius: 16px; background: #f3f7ff; padding: 1rem 1.2rem;
      margin: 1rem 0; text-align: center;
    }
    #local-slide .handoff-emoji { font-size: 3.2em; line-height: 1.1; }
    #local-slide .handoff-title { font-size: 1.3em; font-weight: 700; margin: 0.3rem 0; }
    #local-slide .handoff-where {
      display: inline-block; margin: 0.4rem 0; padding: 0.4rem 1rem; border-radius: 8px; background: #fff;
      border: 1px solid #b9c8e6; font-weight: 700; color: #1a56c4;
    }
    #local-slide .handoff-time { display: block; color: #555; font-size: 0.85em; }
    #local-slide .do-list { text-align: start; display: flex; flex-direction: column; gap: 0.5rem; margin: 0.8rem auto 0; max-width: 26rem; font-size: 0.9em; }

    /* vocabulary cards */
    #local-slide .vocab-grid { display: flex; flex-wrap: wrap; gap: 0.7rem; margin: 1rem 0; }
    #local-slide .vocab {
      flex: 1 1 40%; display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.8rem;
      border-radius: 12px; background: #f5f7fb; border: 1px solid #dfe5f1; font-weight: 700; box-sizing: border-box;
    }
    #local-slide .vocab-emoji { font-size: 1.9em; line-height: 1; flex: 0 0 auto; }

    /* a tick list */
    #local-slide .ticks { display: flex; flex-direction: column; gap: 0.6rem; margin: 1rem 0; }
    #local-slide .tick { display: flex; gap: 0.7rem; align-items: center; }
    #local-slide .tick-mark { flex: 0 0 auto; font-size: 1.4em; }

    /* print dialog */
    #local-slide .mock-print {
      max-width: 28rem; margin: 1rem auto; border: 1px solid #ccc; border-radius: 8px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); background: #fff; direction: ltr; text-align: left;
    }
    #local-slide .print-head { background: #f1f3f4; padding: 0.5rem 1rem; font-weight: 700; border-bottom: 1px solid #ddd; }
    #local-slide .print-row { display: flex; gap: 0.6rem; padding: 0.5rem 1rem; border-bottom: 1px solid #eee; font-size: 0.9em; }
    #local-slide .print-label { flex: 0 0 6.5rem; color: #888; }
    #local-slide .print-row.hl { background: #fff8d6; box-shadow: inset 4px 0 0 #f5b800; font-weight: 700; }
    #local-slide .print-foot { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0.6rem 1rem; }

    /* a formal letter */
    #local-slide .paper {
      max-width: 26rem; margin: 1rem auto; background: #fff; border: 1px solid #ddd; padding: 1rem 1.3rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); font-size: 0.85em; line-height: 1.6; text-align: left; direction: ltr;
    }
    #local-slide .paper .gap { height: 0.6rem; }
    #local-slide .paper .tag {
      float: right; clear: right; font-size: 0.7em; font-weight: 700; background: #1a56c4; color: #fff;
      border-radius: 999px; padding: 0.05rem 0.55rem; margin-left: 0.5rem;
    }

    #local-slide .click-line small { display: block; color: #555; font-size: 0.8em; margin-top: 0.15rem; }
    #local-slide .wp-color { color: #d33; border-bottom: 3px solid #d33; line-height: 1; }
    #local-slide .ltr { direction: ltr; text-align: left; }
  </style>
</head>
<body>
  <div class="topbar" id="topbar">
    <span class="dot ok" id="dot"></span>
    <span id="counter">—</span>
    <span id="title"></span>
    <span class="spacer"></span>
    <span id="viewers">0 collegati</span>
    <button id="blank-btn" hidden>Pausa (B)</button>
    <button id="end-btn" hidden>Termina</button>
  </div>
  <main>
    <div id="setup">
      <h1>Avvia la presentazione</h1>
      <form id="setup-form">
        <label>Link di Google Slides
          <input type="text" name="url" required placeholder="https://docs.google.com/presentation/d/...">
        </label>
        <label>Titolo
          <input type="text" name="title" required>
        </label>
        <label>Numero di slide
          <input type="number" name="slide_count" min="1" required>
        </label>
        <button type="submit">Inizia</button>
      </form>
      <div class="or-divider">oppure</div>
      <form id="setup-form-local">
        <label>Slide locali
          <select name="deck_slug" required>
            {% for deck in decks %}
            <option value="{{ deck.slug }}">{{ deck.title }} ({{ deck.slide_count }} slide)</option>
            {% endfor %}
          </select>
        </label>
        <button type="submit">Inizia (locale)</button>
      </form>
    </div>
    <iframe id="frame" hidden></iframe>
    <div id="local-slide" hidden></div>
  </main>

  <script>
    let state = {{ state_json | safe }};
    let lastPostAt = Date.now();
    let lastLocalKey = null;

    function embedUrl(fileId, index) {
      return `https://docs.google.com/presentation/d/${fileId}/embed`
        + `?rm=minimal&start=false&loop=false&slide=${index}`;
    }

    async function loadLocalSlide(deckSlug, index) {
      const box = document.getElementById("local-slide");
      try {
        const response = await fetch(`/admin/api/decks/${deckSlug}/slides/${index}`);
        const data = await response.json();
        box.innerHTML = data.it;
      } catch (e) {
        // leave whatever was showing
      }
    }

    function render() {
      const setup = document.getElementById("setup");
      const frame = document.getElementById("frame");
      const localBox = document.getElementById("local-slide");
      const blankBtn = document.getElementById("blank-btn");
      const endBtn = document.getElementById("end-btn");
      const ended = state.status === "ended";

      setup.hidden = !ended;
      blankBtn.hidden = ended;
      endBtn.hidden = ended;
      if (ended) {
        frame.hidden = true;
        localBox.hidden = true;
        return;
      }

      document.getElementById("counter").textContent = `${state.index} / ${state.slide_count}`;
      document.getElementById("title").textContent = state.title || "";
      blankBtn.textContent = state.status === "blank" ? "Riprendi (B)" : "Pausa (B)";

      const isLocal = state.source === "local";
      frame.hidden = isLocal;
      localBox.hidden = !isLocal;

      const key = `${state.source}:${state.deck_slug}:${state.index}`;
      if (key === lastLocalKey) return;
      lastLocalKey = key;
      if (isLocal) {
        loadLocalSlide(state.deck_slug, state.index);
      } else {
        frame.src = embedUrl(state.file_id, state.index);
      }
    }
    render();

    async function post(path, body) {
      const dot = document.getElementById("dot");
      try {
        const response = await fetch("/admin/api/live" + path, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body || {}),
        });
        if (!response.ok) throw new Error(await response.text());
        lastPostAt = Date.now();
        dot.className = "dot ok";
        return await response.json();
      } catch (e) {
        dot.className = "dot bad";
        throw e;
      }
    }

    setInterval(() => {
      const dot = document.getElementById("dot");
      if (dot.className === "dot bad") return;
      dot.className = Date.now() - lastPostAt > 5000 ? "dot warn" : "dot ok";
    }, 1000);

    function goto(index) {
      if (state.status === "ended") return;
      const clamped = Math.max(1, Math.min(index, state.slide_count));
      if (clamped === state.index) return;
      state.index = clamped;
      render();
      post("/goto", {index: clamped}).catch(() => {});
    }

    document.getElementById("setup-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      try {
        state = await post("/start", {
          file_id_or_url: form.get("url"),
          title: form.get("title"),
          slide_count: parseInt(form.get("slide_count"), 10),
        });
        render();
      } catch (e) {
        alert("Impossibile avviare: " + e.message);
      }
    });

    document.getElementById("setup-form-local").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      try {
        state = await post("/start_local", { deck_slug: form.get("deck_slug") });
        render();
      } catch (e) {
        alert("Impossibile avviare: " + e.message);
      }
    });

    document.getElementById("blank-btn").addEventListener("click", async () => {
      const next = state.status === "blank" ? "live" : "blank";
      state.status = next;
      render();
      await post("/status", {status: next}).catch(() => {});
    });

    document.getElementById("end-btn").addEventListener("click", async () => {
      if (!confirm("Terminare la sessione live?")) return;
      await post("/end", {}).catch(() => {});
      state.status = "ended";
      render();
    });

    window.addEventListener("keydown", (event) => {
      const tag = document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (state.status === "ended") return;
      switch (event.key) {
        case "ArrowRight": case "ArrowDown": case " ": case "PageDown":
          event.preventDefault(); goto(state.index + 1); break;
        case "ArrowLeft": case "ArrowUp": case "PageUp":
          event.preventDefault(); goto(state.index - 1); break;
        case "Home":
          event.preventDefault(); goto(1); break;
        case "End":
          event.preventDefault(); goto(state.slide_count); break;
        case "b": case "B":
          event.preventDefault(); document.getElementById("blank-btn").click(); break;
      }
    });

    setInterval(async () => {
      try {
        const response = await fetch("/admin/api/live/count");
        const data = await response.json();
        document.getElementById("viewers").textContent = `${data.count} collegati`;
      } catch (e) {
        // leave the last known count showing
      }
    }, 5000);
  </script>
</body>
</html>
