{% extends "_base.html" %}
{% import "_macros.html" as m with context %}
{% block topbar_left %}
<a href="/course/lezione-1" class="back-link" {{ m.title_attr("Indietro") }}>&larr; Indietro</a>
<span class="pill" id="pill">—</span>
{% endblock %}
{% block topbar_extra %}
<a href="#" id="view-link" target="_blank" rel="noopener" hidden></a>
<button id="back-btn" hidden></button>
{% endblock %}
{% block main %}
<div id="reconnecting" class="strip" hidden></div>
<p id="waiting" class="waiting" hidden></p>
<div id="viewer" hidden>
  <iframe id="frame" class="game-frame-full"></iframe>
  <div id="split" class="split" hidden>
    <div class="slide-pane">
      <div class="slide-box" id="slide-it" lang="it"></div>
    </div>
    <div class="slide-pane" id="slide-translated-pane">
      <div class="slide-box" id="slide-translated"></div>
    </div>
  </div>
  <div id="blank-screen" class="blank-screen" hidden></div>
</div>
<script>
  const STRINGS = {{ follow_strings_json | safe }};
  const CURRENT_LANG = "{{ lang }}";
  const IS_RTL = {{ "true" if is_rtl else "false" }};
  function t(key) { return STRINGS[key]; }

  let mode = "live";
  let state = null;
  let browsingIndex = 1;
  let lastRevision = -1;
  let lastAppliedKey = null;
  let sseFailures = 0;
  let pollTimer = null;
  let es = null;

  function embedUrl(fileId, index) {
    return `https://docs.google.com/presentation/d/${fileId}/embed`
      + `?rm=minimal&start=false&loop=false&slide=${index}`;
  }

  async function loadLocalSlide(index) {
    const itBox = document.getElementById("slide-it");
    const translatedBox = document.getElementById("slide-translated");
    const translatedPane = document.getElementById("slide-translated-pane");
    try {
      const response = await fetch(`/api/live/slide?index=${index}`);
      const data = await response.json();
      itBox.innerHTML = data.it;
      if (data.translated) {
        translatedBox.innerHTML = data.translated;
        translatedBox.lang = CURRENT_LANG;
        translatedBox.dir = IS_RTL ? "rtl" : "ltr";
        translatedPane.hidden = false;
      } else {
        translatedPane.hidden = true;
      }
    } catch (e) {
      // leave whatever was showing
    }
  }

  function render() {
    const waiting = document.getElementById("waiting");
    const viewer = document.getElementById("viewer");
    const viewLink = document.getElementById("view-link");
    const backBtn = document.getElementById("back-btn");
    const frame = document.getElementById("frame");
    const split = document.getElementById("split");
    const blankScreen = document.getElementById("blank-screen");

    backBtn.textContent = t("back");

    if (!state || state.status === "ended") {
      viewer.hidden = true;
      viewLink.hidden = true;
      backBtn.hidden = true;
      waiting.hidden = false;
      waiting.textContent = t("waiting");
      return;
    }
    waiting.hidden = true;
    viewer.hidden = false;
    backBtn.hidden = mode === "live";

    document.getElementById("pill").textContent = mode === "live" ? t("live") : t("browsing");

    if (state.status === "blank") {
      frame.hidden = true;
      split.hidden = true;
      blankScreen.hidden = false;
      return;
    }
    blankScreen.hidden = true;

    const targetIndex = mode === "live" ? state.index : browsingIndex;
    const isLocal = state.source === "local";

    viewLink.hidden = isLocal;
    if (!isLocal) {
      viewLink.href = `https://docs.google.com/presentation/d/${state.file_id}/edit`;
      viewLink.textContent = t("viewLink");
    }

    frame.hidden = isLocal;
    split.hidden = !isLocal;

    const key = `${state.source}:${targetIndex}`;
    if (key === lastAppliedKey) return;
    lastAppliedKey = key;
    if (isLocal) {
      loadLocalSlide(targetIndex);
    } else {
      frame.src = embedUrl(state.file_id, targetIndex);
    }
  }

  function applyState(newState) {
    if (!newState || newState.revision <= lastRevision) return;
    lastRevision = newState.revision;
    state = newState;
    if (mode === "live") browsingIndex = state.index;
    render();
  }

  function goBrowsing(delta) {
    if (!state || state.status === "ended") return;
    mode = "browsing";
    browsingIndex = Math.max(1, Math.min(browsingIndex + delta, state.slide_count));
    render();
  }

  document.getElementById("back-btn").addEventListener("click", () => {
    mode = "live";
    if (state) browsingIndex = state.index;
    render();
  });

  window.addEventListener("keydown", (e) => {
    if (["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key)) {
      e.preventDefault();
      goBrowsing(1);
    } else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) {
      e.preventDefault();
      goBrowsing(-1);
    }
  });

  function showReconnecting(show) {
    const strip = document.getElementById("reconnecting");
    strip.textContent = t("reconnecting");
    strip.hidden = !show;
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(async () => {
      try {
        const response = await fetch("/api/live");
        applyState(await response.json());
        showReconnecting(false);
      } catch (e) {
        showReconnecting(true);
      }
    }, 3000);
  }

  function connectSSE() {
    es = new EventSource("/api/live/stream");
    es.addEventListener("state", (event) => {
      sseFailures = 0;
      showReconnecting(false);
      applyState(JSON.parse(event.data));
    });
    es.onerror = () => {
      sseFailures++;
      showReconnecting(true);
      if (sseFailures >= 2) {
        es.close();
        startPolling();
        setTimeout(() => { sseFailures = 0; connectSSE(); }, 10000);
      }
    };
  }

  render();
  connectSSE();
</script>
{% endblock %}
