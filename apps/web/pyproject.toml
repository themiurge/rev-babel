[project]
name = "rev-babel-web"
version = "0.1.0"
description = "FastAPI app: pages, sessions, and WebSocket fan-out. Placeholder — no routes implemented yet."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
